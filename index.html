<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人兴趣爱好展示</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="particles-js"></div>
    <header>
        <h1>欢迎来到我的爱好世界</h1>
        <nav>
            <ul>
                <li><a href="#interests">兴趣爱好</a></li>
                <li><a href="#blog">最新动态</a></li>
                <li><a href="#contact">联系我</a></li>
            </ul>
        </nav>
    </header>

    <section id="interests">
        <h2>我的兴趣</h2>
        <div class="gallery">
            <img src="path_to_image1.jpg" alt="兴趣1">
            <img src="path_to_image2.jpg" alt="兴趣2">
            <img src="path_to_image3.jpg" alt="兴趣3">
        </div>
    </section>

    <section id="blog">
        <h2>最新动态</h2>
        <article>
            <h3>文章标题1</h3>
            <p>这是我的一篇关于兴趣爱好的文章...</p>
        </article>
        <article>
            <h3>文章标题2</h3>
            <p>这是另一篇关于兴趣爱好的文章...</p>
        </article>
    </section>

    <footer id="contact">
        <h2>联系我</h2>
        <p>邮箱: example@example.com</p>
        <p>微博: @我的微博</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/particles.js/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            particles: {
                number: { value: 60, density: { enable: true, value_area: 800 } },
                color: { value: '#ffffff' },
                shape: { type: 'circle' },
                opacity: { value: 0.5 },
                size: { value: 3, random: true },
                line_linked: { enable: true, distance: 150, color: '#ffffff', opacity: 0.4, width: 1 },
                collisions: { enable: true },
                move: {
                    enable: true,
                    speed: 2,
                    direction: 'none',
                    random: false,
                    straight: false,
                    out_mode: 'bounce',
                    bounce: true
                }
            },
            interactivity: {
                events: {
                    onhover: { enable: true, mode: 'repulse' },
                    onclick: { enable: true, mode: 'push' },
                    resize: true
                },
                modes: {
                    repulse: { distance: 100 },
                    push: { particles_nb: 4 }
                }
            },
            retina_detect: true
        });
    </script>
</body>
</html>
